<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Agencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Sistema visual del panel: tokens del diseño en Paper. */
  :root {
    --bg: #FFFFFF; --ink: #111111; --muted: #5E5E5E; --line: #E8E8E8; --soft: #F4F4F2;
    --accent: #FFC21A; --accent-soft: #FFF3C4; --up: #1E7A4C; --down: #C23B22;
    --sans: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --r-sm: 4px; --r-md: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  button, select, input, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .envoltura { max-width: 1328px; margin: 0 auto; padding: 0 56px; }
  @media (max-width: 760px) { .envoltura { padding: 0 18px; } }

  /* Encabezado */
  header { border-bottom: 1px solid var(--line); }
  .barra-sup { display: flex; align-items: center; gap: 16px; justify-content: space-between; padding: 24px 0 18px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  .logo .a { width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--accent); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
  .logo .sub { font-weight: 400; color: var(--muted); }
  .controles { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pildoras { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
  .pildoras button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 14px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .pildoras button.activa { background: var(--soft); color: var(--ink); font-weight: 600; }
  .punto { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .btn { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-md); padding: 8px 14px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #cfcfcf; }
  .btn.amarillo { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .btn.negro { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: default; }
  select.btn { padding-right: 10px; }
  .act { font: 12px var(--mono); color: var(--muted); }
  nav { display: flex; gap: 28px; overflow-x: auto; }
  nav button { border: 0; background: none; padding: 0 0 12px; font-size: 15px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  nav button.activa { color: var(--ink); font-weight: 500; border-bottom-color: var(--ink); }
  .badge[hidden] { display: none; }
  .badge { background: var(--accent); color: var(--ink); font-size: 12px; font-weight: 700; border-radius: 999px; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; }

  /* Héroe y escala de números: nivel 1 (120 / frase 72), nivel 2 (32), nivel 3 (18 + mono 14) */
  .heroe { padding: 56px 0 40px; }
  .ceja { font: 500 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .n1 { font-size: 120px; font-weight: 800; letter-spacing: -.05em; line-height: .95; margin: 14px 0 12px; }
  .n1.frase { font-size: 72px; letter-spacing: -.05em; }
  .heroe p { margin: 0; color: var(--muted); font-size: 16px; max-width: 760px; }
  @media (max-width: 760px) { .n1 { font-size: 72px; } .n1.frase { font-size: 44px; } }
  .n2 { font-size: 32px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
  @media (max-width: 760px) { .n2 { font-size: 28px; } }

  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); border-top: 2px solid var(--ink); }
  .tarjeta { padding: 20px 22px 22px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; }
  .tarjeta + .tarjeta { padding-left: 22px; border-left: 1px solid var(--line); }
  .tarjeta .t { font-weight: 600; }
  .tarjeta .nota { color: var(--muted); font-size: 13px; }
  .fuente { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }

  /* Secciones */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 56px; padding-bottom: 64px; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
  .sec-tit { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin: 0 0 4px; }
  .sec-tit h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
  .sec-tit span { color: var(--muted); font-size: 13px; }
  .bloque { margin-bottom: 48px; }

  .tarea { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--line); }
  @media (max-width: 760px) { .tarea { grid-template-columns: 1fr; gap: 10px; } }
  .tarea h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .tarea p { margin: 0; color: var(--muted); font-size: 14px; }
  .tarea .acc { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .etiq { display: inline-block; font: 600 11px var(--mono); letter-spacing: .08em; padding: 4px 8px; border-radius: var(--r-sm); text-transform: uppercase; white-space: nowrap; }
  .etiq.aprobar { background: var(--accent); }
  .etiq.arreglar { background: var(--down); color: #fff; }
  .etiq.decidir { border: 1.5px solid var(--ink); }
  .etiq.hacer { background: var(--soft); color: var(--muted); }
  .etiq.ok { background: #E3F2EA; color: var(--up); }

  .dia { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .dia .d { font: 500 12px var(--mono); color: var(--muted); letter-spacing: .06em; }
  .dia .d b { display: block; font: 800 22px var(--sans); color: var(--ink); letter-spacing: -.02em; margin-top: 2px; }
  .post-mini { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; margin-bottom: 12px; cursor: pointer; }
  .post-mini:last-child { margin-bottom: 0; }
  .cuadro { width: 40px; height: 40px; border-radius: 6px; }
  .cuadro.vacio { border: 1.5px dashed #c9cdd6; }
  .post-mini b { font-weight: 600; font-size: 14px; display: block; }
  .post-mini span { color: var(--muted); font-size: 12px; }

  .resumen { background: var(--soft); border-radius: 14px; padding: 24px; }
  .resumen .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
  .resumen .n { font-size: 40px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .resumen .l { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .resumen .m { font: 11px var(--mono); color: var(--muted); }
  .resumen .insight { border-left: 3px solid var(--accent); padding-left: 12px; font-size: 14px; }

  .fila { display: grid; grid-template-columns: 44px minmax(0, 1fr) 180px 48px; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .fila.tres { grid-template-columns: 44px minmax(0, 1fr) auto; }
  .fila .cuadro { width: 44px; height: 44px; }
  .fila b { font-weight: 600; font-size: 14px; display: block; }
  .fila .meta { font: 12px var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .fila .total { font-size: 18px; font-weight: 700; text-align: right; }
  .riel { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .riel i { display: block; height: 100%; border-radius: 3px; }
  .barra { display: grid; grid-template-columns: 140px 1fr 56px; gap: 12px; align-items: center; padding: 8px 0; font-size: 14px; }
  .barra .v { font: 14px var(--mono); text-align: right; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 10px 0; border-bottom: 2px solid var(--ink); }
  td { padding: 14px 10px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.mono { font: 14px var(--mono); white-space: nowrap; }
  th { white-space: nowrap; }

  .hall { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .hall .ceja { font-size: 11px; }
  .hall p { margin: 6px 0; font-size: 15px; }
  .hall .acc { font-weight: 600; font-size: 14px; }

  .heroe-paid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 48px; align-items: end; padding: 56px 0 40px; }
  @media (max-width: 1000px) { .heroe-paid { grid-template-columns: 1fr; } }
  .heroe-paid .grande { display: flex; align-items: flex-end; gap: 18px; margin-top: 14px; }
  .heroe-paid .grande .n1 { margin: 0; }
  .heroe-paid .grande b { font-size: 26px; letter-spacing: -.02em; line-height: 1.15; padding-bottom: 14px; }
  .tarjetas.cuatro { grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 0; }
  .tarjetas.cuatro .tarjeta { border-top: 1px solid var(--line); border-bottom: 0; padding: 16px 12px 0 0; }
  .tarjetas.cuatro .tarjeta + .tarjeta { border-left: 0; padding-left: 0; }
  .tarjetas.cuatro .nota { font: 12px var(--mono); }
  @media (max-width: 760px) { .tarjetas.cuatro { grid-template-columns: 1fr 1fr; } }
  .camp { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .camp .cuadro { width: 56px; height: 56px; border-radius: 8px; }
  .camp b { font-size: 16px; font-weight: 600; display: block; }
  .camp .meta { color: var(--muted); font-size: 13px; }
  .camp .est { text-align: right; font-size: 13px; font-weight: 600; }
  .camp .est small { display: block; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
  .switch { width: 46px; height: 26px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--soft); position: relative; cursor: pointer; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
  .switch.on { background: var(--ink); border-color: var(--ink); }
  .switch.on::after { left: 22px; background: var(--accent); }
  .pide { background: var(--soft); border-radius: 14px; padding: 24px; align-self: start; }
  .pide h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.02em; }
  .pide > p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .pide form { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .pide label { display: block; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .pide input, .pide select, .pide textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .pide .todo { grid-column: 1 / -1; }
  .pide .res { margin-top: 14px; font-size: 14px; }
  .burbuja { background: var(--ink); color: #fff; border-radius: 14px 14px 4px 14px; padding: 12px 16px; font-size: 14px; font-weight: 500; margin: 0 0 12px auto; max-width: 85%; width: fit-content; }
  .prop { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .prop .cab { display: flex; justify-content: space-between; align-items: center; }
  .prop h3 { margin: 8px 0 14px; font-size: 20px; letter-spacing: -.02em; }
  .prop .datos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .prop .datos span, .prop .tx span { display: block; color: var(--muted); font-size: 12px; }
  .prop .datos b { font-size: 15px; }
  .prop .tx { padding-top: 12px; font-size: 14px; }
  .prop .nota { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .escribe { display: flex; gap: 8px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px; margin-top: 14px; }
  .escribe input { border: 0; outline: 0; flex: 1; padding: 6px 0; background: transparent; }
  .escribe select { border: 0; background: var(--soft); border-radius: 8px; padding: 6px 8px; }
  .enlace { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }
  .detalle { border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin: 8px 0 24px; }
  .detalle h3 { margin: 6px 0 10px; font-size: 22px; letter-spacing: -.02em; }
  .detalle .copy { white-space: pre-wrap; font-size: 15px; max-height: 260px; overflow: auto; }
  .detalle .tema { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .vacio { color: var(--muted); padding: 24px 0; }
  .aviso { padding: 12px 16px; border-radius: var(--r-md); margin: 20px 0 0; background: var(--accent-soft); }
  .aviso.error { background: #FBE7E3; color: var(--down); }

  dialog { border: 0; border-radius: 14px; padding: 28px; width: min(480px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,.18); }
  dialog::backdrop { background: rgba(17,17,17,.35); }
  dialog h2 { margin: 0 0 6px; letter-spacing: -.02em; }
  dialog label { display: block; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  dialog input, dialog textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); }
  .fila-btn { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  code { font: 13px var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }

  /* Resultados, Analytics, SEO, Agentes y detalle (artboards de «Panel · secciones» en Paper) */
  .ceja-s { font: 600 13px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .ceja-m { font: 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .mu { color: var(--muted); } .up { color: var(--up); } .dn { color: var(--down); } .gris { color: #BDBDBD; }
  .sm { font-size: 13px; }
  .tocable { cursor: pointer; }
  .n1.tocable:hover, .kpi.tocable:hover .n2 { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; }
  .sec-tit.sin { border-bottom: 0; padding-bottom: 14px; margin: 0; }
  .sec-tit .der-btn { display: flex; align-items: center; gap: 16px; }
  .pill { background: var(--accent); border-radius: var(--r-sm); padding: 4px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .pill.gris { background: var(--soft); color: var(--ink); font-weight: 600; }
  .pill.suave { background: var(--accent-soft); font-weight: 600; }
  .comp { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 15px; line-height: 20px; }
  .enlace-n { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: 13px; margin-top: 16px; }
  .enlace-n:hover { color: var(--ink); }
  .dt { font: 12px var(--mono); display: inline-block; width: 52px; text-align: right; flex-shrink: 0; }
  .raya { display: inline-block; width: 26px; height: 3px; background: #BDBDBD; border-radius: 2px; vertical-align: middle; }
  .ancho-embudo { max-width: 884px; }

  /* Héroe con número y tarjetas a la derecha */
  .heroe-a { display: flex; gap: 64px; align-items: flex-end; padding: 64px 0 56px; }
  .heroe-a .izq { width: 620px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
  .heroe-a .grande { display: flex; align-items: baseline; gap: 20px; }
  .heroe-a .n1 { margin: 0; line-height: 120px; }
  .sitios { display: flex; flex-direction: column; gap: 6px; padding-bottom: 14px; font-size: 15px; }
  .sitios .punto { width: 8px; height: 8px; margin-right: 8px; }
  .frase-lado { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.12; padding-bottom: 16px; }
  .kpis { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding-bottom: 8px; }
  .kpi { border-top: 1px solid var(--line); padding-top: 14px; display: grid; grid-template-rows: auto auto 1fr; gap: 8px; }
  .kpi .t { color: var(--muted); font-size: 13px; }
  .kpi .nota { color: var(--muted); }
  .kpi .nota.up { color: var(--up); } .kpi .nota.dn { color: var(--down); }
  @media (max-width: 1100px) { .heroe-a { flex-direction: column; align-items: stretch; gap: 32px; } .heroe-a .izq { width: auto; } }
  @media (max-width: 760px) { .heroe-a .n1 { line-height: 72px; } .kpis { grid-template-columns: 1fr 1fr; } .heroe-a .grande { flex-wrap: wrap; } }

  /* Dos columnas: contenido + 400 px */
  .cols-a { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 56px; padding-bottom: 64px; }
  .cols-d { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; padding: 16px 0 56px; }
  @media (max-width: 1000px) { .cols-a, .cols-d { grid-template-columns: 1fr; } }

  /* Gráfica por día */
  .graf { width: 100%; height: auto; display: block; overflow: visible; }
  .graf .gl { stroke: var(--line); stroke-width: 1; }
  .graf .gt { font: 10px var(--mono); fill: var(--muted); letter-spacing: .04em; }
  .graf .gpk { font: 700 15px var(--sans); fill: var(--ink); }
  .graf .gp { fill: none; stroke: #5E5E5E; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .graf .barra-d:hover rect[fill]:not([fill="transparent"]) { opacity: .8; }
  .leyenda { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .leyenda i.punteada { width: 18px; height: 0; border-top: 2px dashed #5E5E5E; border-radius: 0; vertical-align: 3px; }

  /* Canales y páginas de entrada */
  .canal { border-top: 1px solid var(--line); padding: 14px 0; display: flex; flex-direction: column; gap: 10px; }
  .canales .canal:last-child, .cols-d .canal:last-child { border-bottom: 1px solid var(--line); }
  .canal .fila-c { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 500; }
  .canal .fila-c .der { display: flex; gap: 14px; align-items: baseline; }
  .canal .fila-c b { font-size: 20px; letter-spacing: -.02em; }
  .canal.otros .fila-c { color: var(--muted); }
  .entrada { display: grid; grid-template-columns: 10px minmax(0, 1fr) 220px 56px; gap: 10px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .entrada .ruta { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entrada b { text-align: right; font-size: 15px; }
  @media (max-width: 760px) { .entrada { grid-template-columns: 10px minmax(0, 1fr) 48px; } .entrada .riel { display: none; } }
  .evento { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .evento.resalta { background: var(--accent-soft); padding: 14px 10px; font-weight: 600; }

  /* Embudo */
  .embudo .etapa { display: flex; align-items: center; gap: 28px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .embudo .izq { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
  .embudo .t { font-weight: 600; font-size: 15px; }
  .embudo .nota { color: var(--muted); }
  .embudo .forma { flex: 1; max-width: 560px; height: 56px; display: flex; justify-content: center; }
  .embudo .forma svg { width: 100%; height: 56px; }
  .embudo .der { width: 210px; flex-shrink: 0; }
  .embudo .der > div:first-child { white-space: nowrap; }
  .embudo .tasa { font-size: 18px; font-weight: 700; }
  .embudo .tasa.dn { color: var(--down); }
  .embudo .alerta { display: inline-block; margin-top: 6px; background: var(--down); color: #fff; font-size: 11px; font-weight: 700; border-radius: var(--r-sm); padding: 2px 6px; }
  .embudo .sm { font-size: 13px; }
  .embudo .etapa.tocable:hover .n2 { text-decoration: underline; }
  .embudo.compacto .etapa { gap: 20px; padding: 6px 0; }
  .embudo.compacto .izq { width: 170px; gap: 2px; }
  .embudo.compacto .t { font-size: 13px; font-weight: 500; }
  .embudo.compacto .n2 { font-size: 24px; }
  .embudo.compacto .forma { height: 46px; }
  .embudo.compacto .forma svg { height: 46px; }
  .embudo.compacto .der { width: 80px; text-align: right; }
  .embudo.compacto .tasa { font-size: 14px; }
  @media (max-width: 760px) { .embudo .etapa { flex-wrap: wrap; gap: 8px; } .embudo .izq { width: 100%; } .embudo .der { width: auto; } }
  .apilados { border-top: 1px solid var(--line); padding-top: 40px; display: flex; flex-direction: column; gap: 40px; max-width: 884px; }
  .mini-cab { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 4px; }
  .mini-cab b { font-size: 18px; letter-spacing: -.02em; }
  .mini-cab a { font-size: 13px; font-weight: 600; text-decoration: none; }

  /* Atribución */
  .atrib { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 48px; margin-top: 8px; }
  @media (max-width: 1000px) { .atrib { grid-template-columns: 1fr; } }
  .tabla-a .cab, .tabla-a .fila-a { display: grid; grid-template-columns: minmax(0, 1fr) 150px 150px 150px; gap: 24px; align-items: center; border-bottom: 1px solid var(--line); }
  .tabla-a .cab { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 0; }
  .tabla-a .fila-a { min-height: 60px; font-size: 15px; }
  .tabla-a .fila-a > div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .tabla-a .fila-a > div b { font-size: 18px; }
  .tabla-a .fila-a .riel { width: 100%; }
  .notas-a { display: grid; grid-template-columns: 1fr 150px; gap: 24px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .notas-a p { margin: 14px 0 0; }
  @media (max-width: 760px) { .tabla-a .cab, .tabla-a .fila-a { grid-template-columns: 1fr 70px 70px; } .tabla-a .cab span:last-child, .tabla-a .fila-a > span:last-child { display: none; } .notas-a { grid-template-columns: 1fr; } }
  .caminos { display: flex; flex-direction: column; gap: 24px; }
  .lista-c { border-top: 1px solid var(--line); margin-top: 10px; }
  .lista-c > div { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .lista-c > div b { font-size: 18px; }
  .lista-c > div.resalta { background: var(--accent-soft); padding: 10px 8px; }
  .lectura { background: var(--soft); border-radius: 12px; padding: 20px 22px; }
  .lectura p { margin: 8px 0 0; font-size: 15px; line-height: 22px; }
  .lectura p.sm { font-size: 13px; line-height: 19px; }

  /* Pantalla de detalle */
  .det { background: var(--bg); }
  body.con-det > header, body.con-det > main { display: none; }
  a.btn { text-decoration: none; display: inline-block; }
  .det-cab { border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .det-cab .envoltura { display: flex; align-items: center; gap: 20px; padding-top: 14px; padding-bottom: 14px; }
  .det-cab .mono { flex: 1; letter-spacing: .06em; }
  .det-cab .atras { background: none; border: 0; border-right: 1px solid var(--line); padding: 0 20px 0 0; font-weight: 600; font-size: 15px; cursor: pointer; }
  .det-cuerpo .heroe-a { padding-top: 48px; }
  .tabla-d th.r, .tabla-d td.r, table.kw th.r, table.kw td.r { text-align: right; }
  .tabla-d td.tot, table.kw td.tot { font-size: 18px; font-weight: 700; }
  .tabla-d td, table.kw td { vertical-align: middle; }
  .como { background: var(--soft); border-radius: 14px; padding: 32px; display: grid; grid-template-columns: 276px 1fr; gap: 0; margin: 8px 0 80px; }
  .como p { margin: 0 0 12px; max-width: 760px; font-size: 15px; line-height: 24px; }
  @media (max-width: 760px) { .como { grid-template-columns: 1fr; gap: 14px; } }

  /* SEO */
  .props { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1000px) { .props { grid-template-columns: 1fr; } }
  .prop-seo { border: 1px solid var(--line); border-radius: var(--r-md); padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; }
  .prop-seo .antes { color: var(--muted); text-decoration: line-through; font-size: 13px; }
  .prop-seo .nuevo { font-size: 17px; font-weight: 600; line-height: 24px; }
  .prop-seo .fila-btn { margin-top: 6px; }
  .por-arreglar { border-bottom: 1px solid var(--line); padding: 16px 0 22px; }
  .por-arreglar .mono { font-size: 13px; }
  .por-arreglar p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

  /* Agentes */
  .heroe-ag { display: flex; justify-content: space-between; align-items: flex-end; gap: 48px; padding: 56px 0 56px; }
  .heroe-ag .grande { display: flex; align-items: flex-end; gap: 16px; margin: 14px 0 12px; }
  .heroe-ag .n1 { margin: 0; line-height: 100px; }
  .heroe-ag .lado { display: flex; gap: 0; flex-wrap: wrap; row-gap: 20px; }
  .scroll-x { overflow-x: auto; }
  .heroe-ag .lado > div { border-left: 1px solid var(--line); padding: 4px 32px 4px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
  .heroe-ag .lado .t { color: var(--muted); font-size: 13px; }
  .heroe-ag .lado .sig { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  @media (max-width: 1000px) { .heroe-ag { flex-direction: column; align-items: flex-start; } .heroe-ag .lado > div:first-child { border-left: 0; padding-left: 0; } }
  @media (max-width: 760px) { .heroe-ag .lado > div { min-width: 0; padding-right: 16px; } .tabla-d { font-size: 13px; } }
  .grupos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 56px; }
  @media (max-width: 1000px) { .grupos { grid-template-columns: 1fr; } }
  .grupo { border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px 20px 8px; }
  .g-cab { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); font-size: 18px; letter-spacing: -.01em; }
  .g-cab .num { background: var(--ink); color: var(--accent); font: 600 12px var(--mono); border-radius: var(--r-sm); padding: 3px 6px; }
  .ag { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .ag:last-child { border-bottom: 0; }
  .ag b { font-size: 15px; font-weight: 600; }
  .encargo { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .encargo a { text-decoration: none; }
  .encargo.viejo a { color: var(--muted); }
  .encargo .pill { font-size: 13px; padding: 3px 8px; }
  .encargo .cerrado { color: var(--up); font-size: 13px; }
  .detras { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="envoltura">
    <div class="barra-sup">
      <div class="logo"><span class="a" id="logoLetra">A</span><span id="logoNombre">Agencia</span><span class="sub">Marketing</span></div>
      <div class="controles">
        <div class="pildoras" id="marcas"></div>
        <select class="btn" id="dias" title="Periodo">
          <option value="7">Últimos 7 días</option><option value="28" selected>Últimos 28 días</option><option value="90">Últimos 90 días</option>
        </select>
        <span class="act" id="act">sin datos</span>
        <button class="btn" id="recargar">Actualizar</button>
        <button class="btn" id="ajustes">Conexión</button>
      </div>
    </div>
    <nav id="tabs">
      <button data-tab="hoy" class="activa">Hoy <span class="badge" id="badgeHoy" hidden></span></button>
      <button data-tab="resultados">Resultados</button>
      <button data-tab="analytics">Analytics</button>
      <button data-tab="paid">Paid</button>
      <button data-tab="contenido">Contenido</button>
      <button data-tab="seo">SEO</button>
      <button data-tab="agentes">Agentes</button>
      <button data-tab="research">Research</button>
    </nav>
  </div>
</header>
<main class="envoltura" id="contenido"><div class="heroe"><div class="ceja">Panel</div><div class="n1 frase">Conecta tu n8n</div><p>Toca «Conexión» y pon la URL de tu n8n y el token del panel.</p></div></main>

<dialog id="dlgConexion">
  <form method="dialog">
    <h2>Conexión con n8n</h2>
    <label for="nombre">Nombre de la agencia</label>
    <input id="nombre" placeholder="Agencia">
    <label for="url">URL de tu n8n</label>
    <input id="url" placeholder="https://n8n.tu-dominio.com" required>
    <label for="token">Token del panel («Panel (X-Panel-Token)» en n8n)</label>
    <input id="token" type="password" required>
    <p style="color:var(--muted);font-size:13px;margin:12px 0 0">Se guarda solo en este navegador.</p>
    <div class="fila-btn"><button class="btn negro" value="ok">Guardar</button><button class="btn" value="cancel" formnovalidate>Cancelar</button></div>
  </form>
</dialog>

<dialog id="dlgImagen" style="width:min(560px,94vw)">
  <form method="dialog"><img id="imgPaid" alt="Imagen del anuncio" style="width:100%;border-radius:10px;display:block"><div class="fila-btn"><button class="btn">Cerrar</button></div></form>
</dialog>

<dialog id="dlgEncargo">
  <form method="dialog">
    <h2>Encargar algo nuevo</h2>
    <p style="color:var(--muted);margin:0">Se abre un issue con la etiqueta «encargo» en tu repo.</p>
    <label for="encTitulo">Qué quieres</label>
    <input id="encTitulo" maxlength="140" placeholder="Ej.: reporte mensual de Paid por correo">
    <label for="encDetalle">Detalle (opcional)</label>
    <textarea id="encDetalle" rows="4"></textarea>
    <div class="fila-btn"><button class="btn negro" value="ok">Encargar</button><button class="btn" value="cancel" formnovalidate>Cancelar</button></div>
  </form>
</dialog>

<div class="det" id="detalle" hidden></div>

<dialog id="dlgCambios">
  <form method="dialog">
    <h2>Pedir cambios</h2>
    <p id="cambiosPost" style="color:var(--muted);margin:0"></p>
    <label for="cambiosTexto">¿Qué cambio? (imagen, titular o copy)</label>
    <textarea id="cambiosTexto" rows="4"></textarea>
    <div class="fila-btn"><button class="btn negro" value="ok">Mandar</button><button class="btn" value="cancel" formnovalidate>Cancelar</button></div>
  </form>
</dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const fmt = n => Number(n || 0).toLocaleString('es-MX');
  const PALETA = ['#5C65D1', '#5AA6F7', '#E07A5F', '#2A9D8F', '#C77DFF', '#F4A261'];
  const DIAS = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  let datos = null, tab = 'hoy', marca = '', abierto = '';
  let ana = null, anaErr = '', ag = null, agErr = '', det = '';
  const verTodo = {};
  const mem = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const conf = () => ({ url: mem.get('panel_url'), token: mem.get('panel_token'), nombre: mem.get('panel_nombre') || 'Agencia' });

  function pintarLogo() { const n = conf().nombre; $('#logoNombre').textContent = n; $('#logoLetra').textContent = n.trim().charAt(0).toUpperCase() || 'A'; }

  async function pedir(ruta, opciones = {}) {
    const c = conf();
    if (!c.url || !c.token) throw new Error('Falta configurar la conexión.');
    const r = await fetch(c.url + '/webhook/' + ruta, { ...opciones, headers: { 'X-Panel-Token': c.token, 'Content-Type': 'application/json', ...(opciones.headers || {}) } });
    const texto = await r.text();
    let j = {}; try { j = JSON.parse(texto); } catch (e) { j = { motivo: texto.slice(0, 200) }; }
    if (!r.ok) throw new Error(j.motivo || j.mensaje || j.message || ('n8n respondió ' + r.status));
    return j;
  }

  async function cargar() {
    const dias = $('#dias').value;
    const [a, b, c] = await Promise.allSettled([pedir('agencia-panel?dias=' + dias), pedir('agencia-panel-analytics?dias=' + dias), pedir('agencia-panel-agentes')]);
    ana = b.status === 'fulfilled' && b.value && b.value.marcas ? b.value : null; anaErr = b.status === 'rejected' ? b.reason.message : '';
    ag = c.status === 'fulfilled' ? c.value : null; agErr = c.status === 'rejected' ? c.reason.message : '';
    if (a.status === 'rejected') { $('#contenido').innerHTML = '<div class="aviso error">' + esc(a.reason.message) + '</div>'; return; }
    datos = a.value;
    $('#act').textContent = 'act. ' + String(datos.generado || '').slice(11, 16);
    pintarMarcas();
    pintar();
  }

  // Marcas y colores (en el orden en que aparecen; los colores de la paleta se asignan en ese orden).
  const listaMarcas = () => datos ? [...new Set([...(datos.posts || []).map(p => p.marca), ...Object.keys((datos.leads || {}).por_marca || {}), ...(datos.articulos || []).map(a => a.marca), ...Object.keys((ana && ana.marcas) || {})].filter(Boolean))].sort() : [];
  const color = m => PALETA[Math.max(0, listaMarcas().indexOf(m)) % PALETA.length];
  const nombreMarca = m => String(m || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  const deMarca = x => !marca || x.marca === marca;
  function pintarMarcas() {
    const ms = listaMarcas();
    $('#marcas').innerHTML = '<button data-m="" class="' + (!marca ? 'activa' : '') + '">' + (ms.length === 2 ? 'Ambas' : 'Todas') + '</button>' + ms.map(m => '<button data-m="' + esc(m) + '" class="' + (m === marca ? 'activa' : '') + '"><span class="punto" style="background:' + color(m) + '"></span>' + esc(nombreMarca(m)) + '</button>').join('');
  }
  $('#marcas').onclick = ev => { const b = ev.target.closest('button[data-m]'); if (!b) return; marca = b.dataset.m; pintarMarcas(); pintar(); };

  const fecha = s => { const [y, m, d] = String(s || '').slice(0, 10).split('-').map(Number); return y ? new Date(y, m - 1, d) : null; };
  const hoyTxt = () => { const d = new Date(); return ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
  const cuadro = p => p.estado === 'planeado' || p.estado === 'preparando' ? '<div class="cuadro vacio"></div>' : '<div class="cuadro" style="background:' + color(p.marca) + '"></div>';
  const heroe = (ceja, numero, texto, frase) => '<div class="heroe"><div class="ceja">' + ceja + '</div><div class="n1' + (frase ? ' frase' : '') + '">' + numero + '</div><p>' + texto + '</p></div>';
  const tituloSec = (t, d) => '<div class="sec-tit"><h2>' + t + '</h2><span>' + (d || '') + '</span></div>';
  const tarjeta = (t, n, nota, fuente) => '<div class="tarjeta"><div class="t">' + t + '</div><div class="n2">' + n + '</div><div class="nota">' + (nota || '') + '</div><div class="fuente">' + fuente + '</div></div>';
  function barras(obj, colorear) {
    const pares = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
    if (!pares.length) return '<div class="vacio">Sin datos en el periodo.</div>';
    const max = Math.max(...pares.map(p => p[1]));
    return pares.map(([k, v]) => '<div class="barra"><span>' + esc(colorear ? nombreMarca(k) : k) + '</span><div class="riel"><i style="width:' + Math.max(3, v / max * 100) + '%;background:' + (colorear ? color(k) : 'var(--ink)') + '"></i></div><span class="v">' + fmt(v) + '</span></div>').join('');
  }

  // Lo que necesita a una persona: posts por aprobar, errores y artículos por aprobar.
  function pendientes() {
    const t = [];
    for (const p of (datos.posts || []).filter(deMarca)) {
      if (p.estado === 'por aprobar') t.push({ tipo: 'aprobar', titulo: p.titular || p.post_id, texto: nombreMarca(p.marca) + ' · sale ' + p.fecha + ' ' + (p.hora || '') + ' · v' + (p.version || 1), post: p });
      else if (/^error/.test(p.estado || '')) t.push({ tipo: 'arreglar', titulo: (p.titular || p.post_id), texto: nombreMarca(p.marca) + ' · ' + p.estado + '. ' + (p.estado === 'error al preparar' ? 'Para reintentar, ponlo «planeado» en el Sheet.' : 'Reintenta con 🔁 en Telegram.'), post: p });
      else if (p.estado === 'cambios pedidos') t.push({ tipo: 'decidir', titulo: p.titular || p.post_id, texto: nombreMarca(p.marca) + ' · pediste cambios: «' + (p.cambios_pedidos || '') + '». La versión nueva llega a Telegram.', post: p });
    }
    for (const a of (datos.articulos || []).filter(deMarca)) if (a.estado === 'por aprobar') t.push({ tipo: 'hacer', titulo: a.titulo || a.keyword, texto: nombreMarca(a.marca) + ' · artículo del blog · se aprueba en Telegram con ✅ Publicar' });
    const orden = { arreglar: 0, aprobar: 1, decidir: 2, hacer: 3 };
    return t.sort((a, b) => orden[a.tipo] - orden[b.tipo]);
  }

  function accionesPost(p) {
    const editable = ['por aprobar', 'aprobado', 'cambios pedidos'].includes(p.estado) && !p.fb_url && !p.ig_url;
    if (!editable) return '';
    return (p.estado === 'por aprobar' ? '<button class="btn amarillo" data-acc="aprobar" data-id="' + esc(p.post_id) + '" data-v="' + esc(p.version) + '">Aprobar</button>' : '')
      + '<button class="btn" data-acc="cambios" data-id="' + esc(p.post_id) + '">Pedir cambios</button>'
      + '<button class="btn" data-acc="descartar" data-id="' + esc(p.post_id) + '">Descartar</button>';
  }

  function semana() {
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    const fin = new Date(hoy); fin.setDate(fin.getDate() + 7);
    const porDia = {};
    for (const p of (datos.posts || []).filter(deMarca)) { const f = fecha(p.fecha); if (f && f >= hoy && f < fin && p.estado !== 'descartado') (porDia[p.fecha] = porDia[p.fecha] || []).push(p); }
    const dias = Object.keys(porDia).sort();
    if (!dias.length) return '<div class="vacio">Nada programado en los próximos 7 días.</div>';
    return dias.map(d => { const f = fecha(d); const esHoy = +f === +hoy;
      return '<div class="dia"><div class="d">' + (esHoy ? 'HOY' : DIAS[f.getDay()]) + '<b>' + f.getDate() + '</b></div><div>' + porDia[d].sort((a, b) => String(a.hora).localeCompare(String(b.hora))).map(p => '<div class="post-mini" data-abrir="' + esc(p.post_id) + '">' + cuadro(p) + '<div><b>' + esc(p.titular || p.tema || 'Tema por definir').slice(0, 90) + '</b><span>' + esc(nombreMarca(p.marca)) + ' · ' + esc(p.hora) + ' · ' + esc(p.estado) + '</span></div></div>').join('') + '</div></div>'; }).join('');
  }

  function vistaHoy() {
    const t = pendientes();
    const enPanel = t.filter(x => x.tipo === 'aprobar').length;
    const leads = Object.entries((datos.leads || {}).por_marca || {}).filter(([m]) => !marca || m === marca);
    const totalLeads = leads.reduce((s, [, v]) => s + v, 0);
    const publicados = (datos.posts || []).filter(deMarca).filter(p => p.estado === 'publicado').length;
    const fuentes = Object.entries((datos.leads || {}).por_fuente || {}).sort((a, b) => b[1] - a[1]);
    const insight = fuentes.length && totalLeads ? 'La fuente que más leads trae es <b>' + esc(fuentes[0][0]) + '</b>: ' + fuentes[0][1] + ' de ' + totalLeads + ' en el periodo.' : 'Todavía no hay leads en el periodo.';
    return heroe(hoyTxt(), t.length ? t.length + (t.length === 1 ? ' cosa te espera' : ' cosas te esperan') : 'Nada pendiente', t.length ? enPanel + ' se resuelven con un clic aquí. Lo demás se hace en Telegram o en el Sheet.' : 'No hay nada por aprobar ni con error.', true)
      + '<div class="cols"><div>' + tituloSec('Te toca', 'Ordenado por lo que más bloquea')

    const esperan = abiertos.filter(e => e.etiquetas.includes('espera-ok')).length;
    let h = '<div class="heroe-ag"><div><div class="ceja">La operación · últimas 24 h</div><div class="grande"><div class="n1">' + (conN8n ? bien : '—') + '</div><div class="frase-lado">de ' + todos.length + ' agentes<br>' + (conN8n ? 'trabajando bien' : 'sin conectar') + '</div></div><div class="comp">'
      + (conN8n ? ((apagados.length || errs.length) ? '<span class="pill suave">' + (errs.length ? errs.length + ' con error · ' + esc(errs[0].a[0]) : apagados.length + ' apagado' + (apagados.length > 1 ? 's' : '') + ' · ' + esc(apagados[0].a[0])) + '</span>' : '') + '<span>' + fallas + (fallas === 1 ? ' error · ' : ' errores · ') + corridas + (corridas === 1 ? ' corrida' : ' corridas') + '</span>' : '<span>Activa «Panel agentes» (64) y crea la credencial «n8n API» para ver el estado real.' + (agErr ? ' n8n respondió: ' + esc(agErr) : '') + '</span>') + '</div></div>'
      + '<div class="lado"><div><div class="t">Lo siguiente</div><div class="sig">' + (prox ? esc(prox.a[0]) : '—') + '</div><div class="mono mu">' + (prox ? (prox.d.toDateString() === ahora.toDateString() ? 'hoy ' : DSEM[prox.d.getDay()] + ' ') + hhmm(prox.d) + ' · en ' + (falta >= 60 ? Math.floor(falta / 60) + ' h ' + (falta % 60) : falta + ' min') : '') + '</div></div>'
      + '<div><div class="t">Encargos abiertos</div><div class="n2">' + fmt(abiertos.length) + '</div><div class="mono mu">' + (esperan ? esperan + ' espera' + (esperan > 1 ? 'n' : '') + ' tu OK' : 'en GitHub') + '</div></div></div></div>';
    h += '<div class="sec-tit sin"><h2>Cómo trabajan, en orden</h2><span>Punto verde: corrió bien o está activo · rojo: su última corrida falló · amarillo: apagado · gris: no está en tu n8n</span></div><div class="grupos">' + GRUPOS.map(([g, lista], i) => '<div class="grupo"><div class="g-cab"><span class="num">' + String(i + 1).padStart(2, '0') + '</span><b>' + esc(g) + '</b></div>' + lista.map(a => {
      const s = estadoAgente(a[2]);
      const pt = { ok: 'var(--up)', error: 'var(--down)', apagado: 'var(--accent)', falta: '#BDBDBD', sin: '#BDBDBD' }[s.est];
      const hoy = s.ult && new Date(s.ult.inicio).toDateString() === ahora.toDateString();
      const der = s.est === 'error' ? '<span class="mono dn">✕ ' + hhmm(s.ult.inicio) + '</span>' : (hoy && a[3] && !/\*/.test(a[3].split(' ')[1]) ? '<span class="mono up">✓ ' + hhmm(s.ult.inicio) + '</span>' : '<span class="mono mu">' + esc(s.est === 'falta' ? 'no está' : s.est === 'apagado' ? 'apagado' : a[4]) + '</span>');
      return '<div class="ag" title="' + esc(a[2]) + '"><span class="punto" style="background:' + pt + '"></span><div><b>' + esc(a[0]) + '</b><div class="mu sm">' + esc(a[1]) + '</div></div>' + der + '</div>';
    }).join('') + '</div>').join('') + '</div>';
    const etiq = e => e.estado !== 'open' ? '<span class="cerrado">✓ Cerrado</span>' : e.etiquetas.includes('espera-ok') ? '<span class="pill">Espera tu OK</span>' : e.etiquetas.includes('en-curso') ? '<span class="pill suave">Lo están haciendo</span>' : '<span class="pill gris">Abierto</span>';
    const nuestros = new Set([...todos.map(a => a[2]), ...DEL_PANEL]);
    const detras = conN8n ? (ag.flujos || []).filter(w => !nuestros.has(w.nombre)) : [];
    h += '<div class="cols-a"><div><div class="sec-tit"><h2>Encargos</h2><span>issues con la etiqueta «encargo» en tu repo</span></div>'
      + (enc.length ? enc.slice(0, verTodo.enc ? 30 : 4).map(e => '<div class="encargo' + (e.estado !== 'open' ? ' viejo' : '') + '"><span class="mono mu">#' + e.numero + '</span><a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.titulo) + '</a>' + etiq(e) + '</div>').join('') + (enc.length > 4 ? '<button class="enlace-n" data-ver="enc">' + (verTodo.enc ? 'Ver menos' : 'Ver los ' + enc.length + ' →') + '</button>' : '') : '<div class="vacio">' + (ag && ag.error_github ? 'GitHub: ' + esc(ag.error_github) : 'Sin encargos todavía.') + '</div>')
      + '<div class="fila-btn" style="margin-top:20px"><button class="btn negro" id="nuevoEncargo">Encargar algo nuevo</button></div></div>'
      + '<div><div class="sec-tit sin"><h2>Detrás del panel</h2><span>' + (conN8n ? detras.length + ' flujos' : '') + '</span></div>' + (conN8n ? (detras.length ? detras.slice(0, verTodo.detras ? 100 : 3).map(w => '<div class="detras"><span>' + esc(w.nombre) + '</span><span class="mono ' + (w.activo ? 'up' : 'mu') + '">' + (w.activo ? 'activo' : 'manual') + '</span></div>').join('') + (detras.length > 3 ? '<button class="enlace-n" data-ver="detras">' + (verTodo.detras ? 'Ver menos' : 'Ver los ' + detras.length + ' →') + '</button>' : '') : '<div class="vacio">Solo están los flujos de la agencia.</div>') : '<div class="vacio">Sin conexión con n8n.</div>') + '</div></div>';
    h += '<div class="resumen" style="margin-bottom:64px"><b style="font-size:20px">Cómo subir los flujos a tu n8n</b><ol style="margin:14px 0 0;padding-left:20px;line-height:1.9">'
      + '<li>Crea en n8n las credenciales con los nombres de <code>docs/instalacion.md</code> (paso 5).</li>'
      + '<li>Crea las tablas <code>seo_articulos</code>, <code>paid_campanas</code> y <code>meta_ads_decisiones</code> en n8n → Data tables.</li>'
      + '<li>Copia <code>n8n/config.ejemplo.json</code> como <code>n8n/config.json</code>, llénalo y corre <code>python3 n8n/configurar.py</code>.</li>'
      + '<li>Importa <code>n8n/listos/</code>: <code>n8n import:workflow --separate --input=n8n/listos</code> o uno por uno en Workflows → Import from file.</li>'
      + '<li>Corre una vez «SEO preparar pestañas» y «BigQuery preparar».</li>'
      + '<li>Activa primero Alertas de error, Telegram (respuestas) y Vigilante; luego el resto.</li>'
      + '</ol></div>';
    return h;
  }

  function pintar() {
    if (!datos && tab !== 'agentes') return;
    const vistas = { hoy: vistaHoy, resultados: vistaResultados, analytics: vistaAnalytics, paid: vistaPaid, contenido: vistaContenido, seo: vistaSeo, research: vistaResearch, agentes: vistaAgentes };
    $('#contenido').innerHTML = vistas[tab]();
    const n = datos ? pendientes().length : 0;
    $('#badgeHoy').hidden = !n; $('#badgeHoy').textContent = n;
    const d = $('#detalle');
    if (det && ana) { d.innerHTML = detalle(); d.hidden = false; document.body.classList.add('con-det'); } else { d.hidden = true; d.innerHTML = ''; document.body.classList.remove('con-det'); }
  }
  let scrollAntes = 0;
  function abrirDet(k) { if (!ana) return; scrollAntes = window.scrollY; det = k; verTodo.dias = false; pintar(); window.scrollTo(0, 0); try { history.pushState({ det: k }, ''); } catch (e) {} }
  function cerrarDet() { if (!det) return; det = ''; pintar(); window.scrollTo(0, scrollAntes); }
  window.addEventListener('popstate', () => { if (det) cerrarDet(); });
  function irA(t) { tab = t; det = ''; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('activa', x.dataset.tab === t)); pintar(); window.scrollTo(0, 0); }

  async function accion(acc, id, version, texto) {
    try {
      await pedir('agencia-panel-acciones', { method: 'POST', body: JSON.stringify({ accion: acc, post_id: id, version, texto }) });
      const msj = { aprobar: 'Aprobado: se publica en su fecha.', cambios: 'Cambios pedidos: la versión nueva llega a Telegram en unos minutos.', descartar: 'Descartado.' }[acc];
      $('#contenido').insertAdjacentHTML('afterbegin', '<div class="aviso">' + esc(id) + ' · ' + esc(msj) + '</div>');
      setTimeout(cargar, 1200);
    } catch (e) {
      $('#contenido').insertAdjacentHTML('afterbegin', '<div class="aviso error">' + esc(id) + ': ' + esc(e.message) + '</div>');
    }
  }

  document.addEventListener('click', ev => {
    const ir = ev.target.closest('[data-ir]');
    if (ir) { ev.preventDefault(); irA(ir.dataset.ir); return; }
    const ab = ev.target.closest('[data-abrir]');
    if (ab && !ev.target.closest('a,button[data-acc]')) { abierto = ab.dataset.abrir; if (abierto) irA('contenido'); else pintar(); return; }
    const b = ev.target.closest('button[data-acc]');
    if (!b) return;
    const { acc, id, v } = b.dataset;
    if (acc === 'cambios') {
      $('#cambiosPost').textContent = id;
      $('#cambiosTexto').value = '';
      const d = $('#dlgCambios');
      d.onclose = () => { if (d.returnValue === 'ok' && $('#cambiosTexto').value.trim()) accion('cambios', id, v, $('#cambiosTexto').value.trim()); };
      d.showModal();
      return;
    }
    if (acc === 'descartar' && !confirm('¿Descartar ' + id + '? No se publicará.')) return;
    b.disabled = true;
    accion(acc, id, v);
  });
  // Paid: formulario, prender/apagar e imagen del anuncio.

  document.addEventListener('submit', async ev => {
    if (ev.target.id !== 'formPide') return;
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const texto = String(fd.get('texto') || '').trim();
    if (!texto) return;
    const m = String(fd.get('marca') || marca || (propuesta && propuesta.marca) || listaMarcas()[0] || 'marca-a');
    const anterior = cambiando && propuesta ? propuesta : null;
    pideTexto = anterior ? pideTexto + ' · Cambios: ' + texto : texto;
    pensando = true; paidRes = ''; pintar();
    try {
      const r = await pedir('agencia-paid-propuesta', { method: 'POST', body: JSON.stringify({ marca: anterior ? anterior.marca : m, texto, anterior }) });
      propuesta = r.propuesta || null;
      if (!propuesta) paidRes = '<div class="aviso error" style="margin:0">' + esc(r.mensaje || 'No llegó la propuesta.') + '</div>';
    } catch (e) { paidRes = '<div class="aviso error" style="margin:0">' + esc(e.message) + '</div>'; }
    pensando = false; cambiando = false; pintar();
  });
  document.addEventListener('click', async ev => {
    const bpr = ev.target.closest('button[data-prop]');
    if (bpr && propuesta) {
      ev.preventDefault();
      const que = bpr.dataset.prop;
      if (que === 'cambios') { cambiando = true; pintar(); const inp = document.querySelector('#formPide input'); if (inp) inp.focus(); return; }
      const crear = que === 'crear';
      if (crear && !confirm('Se crea en Meta EN PAUSA (no gasta hasta que la prendas). ¿Sigo?')) return;
      document.querySelectorAll('[data-prop]').forEach(b => { b.disabled = true; });
      $('#paidRes').innerHTML = '<span style="color:var(--muted)">' + (crear ? 'Redactando el anuncio, haciendo la pieza y creando en Meta… tarda 1 a 3 minutos.' : 'Preguntándole a Meta…') + '</span>';
      const { notas, ...p } = propuesta;
      try {
        const r = await pedirPaid({ accion: crear ? 'crear' : 'probar', propuesta: p });
        paidRes = '<div class="aviso' + (r.ok ? '' : ' error') + '" style="margin:0">' + esc(r.mensaje || (r.ok ? 'Listo.' : 'No se pudo.')) + (r.data && r.data.publico_estimado ? '<br>Público estimado: ' + esc(r.data.publico_estimado) : '') + '</div>';
        if (crear && r.ok) { propuesta = null; pideTexto = ''; await cargar(); } else pintar();
      } catch (e) { paidRes = '<div class="aviso error" style="margin:0">' + esc(e.message) + '</div>'; pintar(); }
      return;
    }
    const bp = ev.target.closest('button[data-paid]');
    if (!bp) return;
    const id = bp.dataset.id;
    try {
      if (bp.dataset.paid === 'estado') {
        const prender = bp.dataset.prender === 'true';
        if (prender && !confirm('Prender ' + id + ' empieza a gastar hasta $' + bp.dataset.monto + ' MXN al día. ¿Lo prendo?')) return;
        bp.disabled = true;
        const r = await pedirPaid({ accion: 'estado', campana_id: id, prender });
        paidRes = '<div class="aviso' + (r.ok ? '' : ' error') + '" style="margin:0">' + esc(r.mensaje) + '</div>';
        await cargar();
      } else {
        bp.disabled = true;
        const r = await pedirPaid({ accion: 'ver_imagen', campana_id: id });
        const src = r.data && r.data.imagen;
        bp.disabled = false;
        if (src && /^data:image\//.test(src)) { $('#imgPaid').src = src; $('#dlgImagen').showModal(); }
      }
    } catch (e) { paidRes = '<div class="aviso error" style="margin:0">' + esc(e.message) + '</div>'; pintar(); }
  });
  document.addEventListener('keydown', ev => { if (ev.key !== 'Escape') return; if (det) { if (history.state && history.state.det) history.back(); else cerrarDet(); } else if (abierto) { abierto = ''; pintar(); } });
  // Detalle, «ver todos», filtro de marca desde Resultados, SEO y encargos.
  document.addEventListener('click', async ev => {
    const d = ev.target.closest('[data-det]');
    if (d) { ev.preventDefault(); abrirDet(d.dataset.det); return; }
    if (ev.target.closest('[data-cerrar-det]')) { ev.preventDefault(); if (history.state && history.state.det) history.back(); else cerrarDet(); return; }
    const v = ev.target.closest('[data-ver]');
    if (v) { ev.preventDefault(); verTodo[v.dataset.ver] = !verTodo[v.dataset.ver]; pintar(); return; }
    const mk = ev.target.closest('[data-marca]');
    if (mk) { ev.preventDefault(); marca = mk.dataset.marca; pintarMarcas(); pintar(); window.scrollTo(0, 0); return; }
    const sb = ev.target.closest('button[data-seo]');
    if (sb) {
      const filas = sb.dataset.filas.split(',').map(Number), acc = sb.dataset.seo;
      if (acc === 'aprobar' && filas.length > 1 && !confirm('¿Aprobar las ' + filas.length + ' propuestas?')) return;
      document.querySelectorAll('button[data-seo]').forEach(b => { b.disabled = true; });
      try { const r = await pedir('agencia-panel-seo', { method: 'POST', body: JSON.stringify({ accion: acc, filas }) }); seoRes = '<div class="aviso' + (r.ok ? '' : ' error') + '" style="margin:0">' + esc(r.mensaje || 'Listo.') + '</div>'; if (r.ok && ana && ana.seo) ana.seo.propuestas = (ana.seo.propuestas || []).filter(p => !filas.includes(p.fila)); }
      catch (e) { seoRes = '<div class="aviso error" style="margin:0">' + esc(e.message) + '</div>'; }
      pintar(); return;
    }
    if (ev.target.closest('#nuevoEncargo')) {
      $('#encTitulo').value = ''; $('#encDetalle').value = '';
      const dl = $('#dlgEncargo');
      dl.onclose = async () => {
        if (dl.returnValue !== 'ok' || $('#encTitulo').value.trim().length < 5) return;
        try { const r = await pedir('agencia-panel-encargo', { method: 'POST', body: JSON.stringify({ titulo: $('#encTitulo').value.trim(), detalle: $('#encDetalle').value.trim() }) }); $('#contenido').insertAdjacentHTML('afterbegin', '<div class="aviso' + (r.ok ? '' : ' error') + '">' + esc(r.mensaje) + '</div>'); if (r.ok) setTimeout(cargar, 800); }
        catch (e) { $('#contenido').insertAdjacentHTML('afterbegin', '<div class="aviso error">' + esc(e.message) + '</div>'); }
      };
      dl.showModal();
    }
  });
  $('#tabs').onclick = ev => { const b = ev.target.closest('button[data-tab]'); if (b) irA(b.dataset.tab); };
  $('#recargar').onclick = cargar;
  $('#dias').onchange = cargar;
  $('#ajustes').onclick = () => {
    const c = conf();
    $('#nombre').value = c.nombre; $('#url').value = c.url; $('#token').value = c.token;
    const d = $('#dlgConexion');
    d.onclose = () => { if (d.returnValue === 'ok') { mem.set('panel_nombre', $('#nombre').value.trim() || 'Agencia'); mem.set('panel_url', $('#url').value.trim().replace(/\/+$/, '')); mem.set('panel_token', $('#token').value.trim()); pintarLogo(); cargar(); } };
    d.showModal();
  };
  pintarLogo();
  if (conf().url && conf().token) cargar(); else $('#ajustes').click();
})();
</script>
</body>
</html>
